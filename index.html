<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Conquest</title>
    <link rel="stylesheet" href="./style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="start-screen">

    <div class="background-grid"></div>
    <div class="scanlines"></div>

    <div class="system-status">
        <span class="status-light"></span>
        GLOBAL CONQUEST SYSTEM ONLINE
    </div>

    <div class="version">
        BUILD 1.0.0 // COMMAND NETWORK
    </div>

    <main class="start-content">

        <div class="title-small">WELCOME TO</div>

        <h1>GLOBAL<br><span>CONQUEST</span></h1>

        <div class="title-line"></div>

        <p class="tagline">
            COMMAND • CONQUER • SURVIVE
        </p>

        <button id="enterCommandBtn" class="main-button">
            <span>ENTER COMMAND</span>
            <span>→</span>
        </button>

    </main>

    <div class="bottom-info">
        <span>STRATEGIC COMMAND NETWORK</span>
        <span>•</span>
        <span>ONLINE</span>
    </div>

</div>


<!-- LOGIN -->

<div id="loginOverlay" class="login-overlay hidden">

    <div class="login-grid"></div>
    <div class="login-scanlines"></div>

    <div class="login-box">

        <div class="login-corner tl"></div>
        <div class="login-corner tr"></div>
        <div class="login-corner bl"></div>
        <div class="login-corner br"></div>

        <div class="login-top">
            <span class="status-light"></span>
            SECURE COMMAND LOGIN
        </div>

        <h2>COMMAND ACCESS</h2>

        <p class="login-subtitle">
            IDENTIFY YOURSELF, COMMANDER
        </p>

        <form id="loginForm">

            <label for="naam">COMMANDER NAME</label>

            <input
                id="naam"
                type="text"
                autocomplete="username"
                required
            >

            <label for="wachtwoord">PASSWORD</label>

            <input
                id="wachtwoord"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="login-button">
                ACCESS COMMAND
            </button>

        </form>

        <button id="closeLoginBtn" class="close-login">
            CANCEL
        </button>

        <div id="loginStatus" class="login-status"></div>

    </div>

</div>


<script>
const supabaseUrl =
    "https://qelqaiczgibxyxfqtapg.supabase.co";

const supabaseKey =
    "sb_publishable_aZSOOfRnROvePvZ2WWNv8g_ZhfZTCes";

const database =
    window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


const enterCommandBtn =
    document.getElementById("enterCommandBtn");

const loginOverlay =
    document.getElementById("loginOverlay");

const closeLoginBtn =
    document.getElementById("closeLoginBtn");

const loginForm =
    document.getElementById("loginForm");

const loginStatus =
    document.getElementById("loginStatus");


/* -----------------------------------------
   OPEN LOGIN
----------------------------------------- */

enterCommandBtn.addEventListener("click", () => {

    loginOverlay.classList.remove("hidden");

    setTimeout(() => {
        document
            .getElementById("naam")
            .focus();
    }, 100);

});


/* -----------------------------------------
   CLOSE LOGIN
----------------------------------------- */

closeLoginBtn.addEventListener("click", () => {

    loginOverlay.classList.add("hidden");

    loginStatus.textContent = "";

});


/* -----------------------------------------
   LOGIN
----------------------------------------- */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const naam =
            document
                .getElementById("naam")
                .value
                .trim();

        const wachtwoord =
            document
                .getElementById("wachtwoord")
                .value;

        loginStatus.textContent =
            "AUTHENTICATING COMMANDER...";

        loginStatus.className =
            "login-status loading";


        try {

            /* -----------------------------
               CUSTOM LOGIN
            ----------------------------- */

            const {
                data,
                error
            } =
                await database.functions.invoke(
                    "login",
                    {
                        body: {
                            naam,
                            wachtwoord
                        }
                    }
                );


            if (error) {
                throw error;
            }


            if (
                !data ||
                data.success === false
            ) {

                throw new Error(
                    data?.error ||
                    data?.message ||
                    "Login mislukt."
                );

            }


            const spelerNaam =
                data.speler_naam || naam;


            /* -----------------------------
               SUPABASE AUTH SESSION
            ----------------------------- */

            if (
                data.access_token &&
                data.refresh_token
            ) {

                const {
                    error: sessionError
                } =
                    await database.auth.setSession({
                        access_token:
                            data.access_token,

                        refresh_token:
                            data.refresh_token
                    });


                if (sessionError) {
                    throw sessionError;
                }

            } else {

                throw new Error(
                    "De server heeft geen beveiligde sessie teruggegeven."
                );

            }


            /* -----------------------------
               BESTAANDE GLOBAL CONQUEST LOGIN
            ----------------------------- */

            sessionStorage.setItem(
                "globalConquestPlayer",
                spelerNaam
            );


            /* -----------------------------
               GO TO GAME
            ----------------------------- */

            window.location.href =
                "./game.html";

        } catch (error) {

            console.error(
                "Login error:",
                error
            );

            loginStatus.textContent =
                error.message ||
                "Login mislukt.";

            loginStatus.className =
                "login-status error";

        }

    }
);


/* -----------------------------------------
   ESCAPE = CLOSE LOGIN
----------------------------------------- */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Escape" &&
            !loginOverlay.classList.contains(
                "hidden"
            )
        ) {

            loginOverlay.classList.add(
                "hidden"
            );

        }

    }
);
</script>

</body>
</html>
