```html
<!DOCTYPE html>

<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Conquest</title>
    <link rel="stylesheet" href="./style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="start-screen">

    <div class="background-grid"></div>
    <div class="scanlines"></div>

    <div class="system-status">
        <span class="status-light"></span>
        GLOBAL CONQUEST SYSTEM ONLINE
    </div>

    <div class="version">
        BUILD 1.0.0 // COMMAND NETWORK
    </div>

    <main class="start-content">

        <div class="title-small">WELCOME TO</div>

        <h1>GLOBAL<br><span>CONQUEST</span></h1>

        <div class="title-line"></div>

        <p class="tagline">
            COMMAND • CONQUER • SURVIVE
        </p>

        <button id="enterCommandBtn" class="main-button">
            <span>ENTER COMMAND</span>
            <span>→</span>
        </button>

    </main>

    <div class="bottom-info">
        <span>STRATEGIC COMMAND NETWORK</span>
        <span>•</span>
        <span>ONLINE</span>
    </div>

</div>


<!-- LOGIN -->

<div id="loginOverlay" class="login-overlay hidden">

    <div class="login-grid"></div>
    <div class="login-scanlines"></div>

    <div class="login-box">

        <div class="login-corner tl"></div>
        <div class="login-corner tr"></div>
        <div class="login-corner bl"></div>
        <div class="login-corner br"></div>

        <div class="login-top">
            <span class="status-light"></span>
            SECURE COMMAND LOGIN
        </div>

        <h2>COMMAND ACCESS</h2>

        <p class="login-subtitle">
            IDENTIFY YOURSELF, COMMANDER
        </p>

        <form id="loginForm">

            <label for="naam">COMMANDER NAME</label>

            <input
                id="naam"
                type="text"
                autocomplete="username"
                required
            >

            <label for="wachtwoord">PASSWORD</label>

            <input
                id="wachtwoord"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="login-button">
                ACCESS COMMAND
            </button>

        </form>

        <button id="closeLoginBtn" class="close-login">
            CANCEL
        </button>

        <div id="loginStatus" class="login-status"></div>

    </div>

</div>


<script>

const supabaseUrl =
    "https://qelqaiczgibxyxfqtapg.supabase.co";

const supabaseKey =
    "sb_publishable_aZSOOfRnROvePvZ2WWNv8g_ZhfZTCes";

const database =
    window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


/* -----------------------------------------
   ELEMENTEN
----------------------------------------- */

const enterCommandBtn =
    document.getElementById(
        "enterCommandBtn"
    );

const loginOverlay =
    document.getElementById(
        "loginOverlay"
    );

const closeLoginBtn =
    document.getElementById(
        "closeLoginBtn"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginStatus =
    document.getElementById(
        "loginStatus"
    );


/* -----------------------------------------
   LOGIN OPENEN
----------------------------------------- */

enterCommandBtn.addEventListener(
    "click",
    () => {

        loginOverlay.classList.remove(
            "hidden"
        );

        setTimeout(() => {

            document
                .getElementById("naam")
                .focus();

        }, 100);

    }
);


/* -----------------------------------------
   LOGIN SLUITEN
----------------------------------------- */

closeLoginBtn.addEventListener(
    "click",
    () => {

        loginOverlay.classList.add(
            "hidden"
        );

        loginStatus.textContent = "";

    }
);


/* -----------------------------------------
   LOGIN
----------------------------------------- */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const naam =
            document
                .getElementById("naam")
                .value
                .trim();

        const wachtwoord =
            document
                .getElementById("wachtwoord")
                .value;


        loginStatus.textContent =
            "AUTHENTICATING COMMANDER...";

        loginStatus.className =
            "login-status loading";


        try {

            const {
                data,
                error
            } =
                await database.functions.invoke(
                    "login",
                    {
                        body: {
                            naam,
                            wachtwoord
                        }
                    }
                );


            if (error) {
                throw error;
            }


            /* ---------------------------------
               TIJDELIJKE DEBUG
            --------------------------------- */

            console.log(
                "LOGIN RESPONSE:",
                data
            );

            console.log(
                "Heeft session token:",
                !!data?.session_token
            );


            /* ---------------------------------
               LOGIN CONTROLEREN
            --------------------------------- */

            if (
                !data ||
                data.success === false
            ) {

                throw new Error(
                    data?.error ||
                    data?.message ||
                    "Login mislukt."
                );

            }


            /* ---------------------------------
               SPELERGEGEVENS OPSLAAN
            --------------------------------- */

            const spelerNaam =
                data.speler_naam || naam;


            sessionStorage.setItem(
                "globalConquestPlayer",
                spelerNaam
            );


            /* ---------------------------------
               PLAYER ID
            --------------------------------- */

            if (data.player_id) {

                sessionStorage.setItem(
                    "globalConquestPlayerId",
                    data.player_id
                );

            }


            /* ---------------------------------
               AUTH ID
            --------------------------------- */

            if (data.auth_id) {

                sessionStorage.setItem(
                    "globalConquestAuthId",
                    data.auth_id
                );

            }


            /* ---------------------------------
               BEVEILIGDE WW3-SESSIE
            --------------------------------- */

            if (data.session_token) {

                sessionStorage.setItem(
                    "globalConquestSession",
                    data.session_token
                );

            }


            /* ---------------------------------
               CONTROLEREN OF TOKEN IS OPGESLAGEN
            --------------------------------- */

            console.log(
                "WW3 sessie opgeslagen:",
                !!sessionStorage.getItem(
                    "globalConquestSession"
                )
            );


            /* ---------------------------------
               NAAR GAME
            --------------------------------- */

            window.location.href =
                "./game.html";


        } catch (error) {

            console.error(
                "Login error:",
                error
            );

            loginStatus.textContent =
                error.message ||
                "Login mislukt.";

            loginStatus.className =
                "login-status error";

        }

    }
);


/* -----------------------------------------
   ESCAPE = LOGIN SLUITEN
----------------------------------------- */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Escape" &&
            !loginOverlay.classList.contains(
                "hidden"
            )
        ) {

            loginOverlay.classList.add(
                "hidden"
            );

        }

    }
);

</script>

</body>
</html>
```
