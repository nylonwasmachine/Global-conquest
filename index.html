<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Global Conquest</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <!-- =====================================================
         STARTSCHERM
         ===================================================== -->

    <main class="start-screen">


        <!-- Achtergronddecoratie -->

        <div class="background-grid"></div>

        <div class="scanlines"></div>


        <!-- Kleine systeeminformatie -->

        <div class="system-status">

            <span class="status-dot"></span>

            SYSTEM ONLINE

        </div>


        <div class="version">
            GLOBAL CONQUEST // COMMAND SYSTEM
        </div>


        <!-- =================================================
             CENTRALE START CONTENT
             ================================================= -->

        <section class="start-content">


            <div class="top-label">
                STRATEGIC COMMAND NETWORK
            </div>


            <h1>
                GLOBAL
                <span>CONQUEST</span>
            </h1>


            <p class="tagline">
                COMMAND • CONQUER • SURVIVE
            </p>


            <div class="start-line"></div>


            <!-- PLAY -->

            <button
                class="play-button"
                onclick="openLogin()"
            >

                <span class="play-icon">
                    ▶
                </span>

                <span class="play-text">
                    ENTER COMMAND
                </span>

            </button>


            <p class="start-hint">
                AUTHORIZED COMMANDERS ONLY
            </p>


        </section>


        <!-- =================================================
             ONDERSTE INFORMATIE
             ================================================= -->

        <div class="bottom-info">


            <div>
                SERVER
                <strong>ONLINE</strong>
            </div>


            <div>
                NETWORK
                <strong>CONNECTED</strong>
            </div>


            <div>
                DATABASE
                <strong>SUPABASE</strong>
            </div>


        </div>


    </main>



    <!-- =====================================================
         FULLSCREEN LOGIN
         ===================================================== -->

    <div
        id="loginOverlay"
        class="login-overlay"
    >


        <div class="login-box">


            <div class="login-top">
                GLOBAL CONQUEST
            </div>


            <div class="login-status-line">

                <span class="status-dot"></span>

                SECURE COMMAND LOGIN

            </div>


            <h2>
                COMMANDER LOGIN
            </h2>


            <p class="login-subtitle">
                ENTER YOUR COMMAND CREDENTIALS
            </p>


            <!-- ACCOUNT -->

            <label for="naam">
                ACCOUNT NAME
            </label>

            <input
                id="naam"
                type="text"
                placeholder="Enter account name"
                autocomplete="username"
            >


            <!-- PASSWORD -->

            <label for="wachtwoord">
                PASSWORD
            </label>

            <input
                id="wachtwoord"
                type="password"
                placeholder="Enter password"
                autocomplete="current-password"
            >


            <!-- LOGIN -->

            <button
                onclick="login()"
                class="login-button"
            >
                ENTER COMMAND
            </button>


            <!-- CANCEL -->

            <button
                onclick="closeLogin()"
                class="close-login"
            >
                ← BACK TO MAIN MENU
            </button>


            <p id="loginStatus"></p>


        </div>


    </div>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /* =====================================================
           SUPABASE
           ===================================================== */

        const supabaseUrl =
            "https://qelqaiczgibxyxfqtapg.supabase.co";


        const supabaseKey =
            "sb_publishable_aZSOOfRnROvePvZ2WWNv8g_ZhfZTCes";


        const database =
            window.supabase.createClient(
                supabaseUrl,
                supabaseKey
            );



        /* =====================================================
           LOGIN OPENEN
           ===================================================== */

        function openLogin() {

            const overlay =
                document.getElementById(
                    "loginOverlay"
                );


            overlay.style.display = "flex";


            document
                .getElementById("loginStatus")
                .textContent = "";


            document
                .getElementById("wachtwoord")
                .value = "";


            document
                .getElementById("naam")
                .focus();

        }



        /* =====================================================
           LOGIN SLUITEN
           ===================================================== */

        function closeLogin() {

            document
                .getElementById("loginOverlay")
                .style.display = "none";


            document
                .getElementById("loginStatus")
                .textContent = "";

        }



        /* =====================================================
           INLOGGEN
           ===================================================== */

        async function login() {


            const naam =
                document
                    .getElementById("naam")
                    .value
                    .trim();


            const wachtwoord =
                document
                    .getElementById("wachtwoord")
                    .value;


            const status =
                document.getElementById(
                    "loginStatus"
                );



            /* ==============================
               CONTROLEREN
               ============================== */

            if (
                !naam ||
                !wachtwoord
            ) {

                status.textContent =
                    "Vul je accountnaam en wachtwoord in.";

                return;

            }



            status.textContent =
                "AUTHENTICATING...";



            try {


                const {
                    data,
                    error
                } =
                    await database.functions.invoke(
                        "login",
                        {
                            body: {
                                naam: naam,
                                wachtwoord: wachtwoord
                            }
                        }
                    );



                /* ==============================
                   FOUT
                   ============================== */

                if (error) {

                    console.error(
                        "Login fout:",
                        error
                    );


                    status.textContent =
                        "Login mislukt.";

                    return;

                }



                /* ==============================
                   VERKEERDE LOGIN
                   ============================== */

                if (
                    !data ||
                    !data.success
                ) {

                    status.textContent =
                        "Verkeerde accountnaam of wachtwoord.";

                    return;

                }



                /* ==============================
                   SPELER OPSLAAN
                   ============================== */

                const spelerNaam =
                    data.speler_naam || naam;


                sessionStorage.setItem(
                    "globalConquestPlayer",
                    spelerNaam
                );



                /* ==============================
                   NAAR GAME
                   ============================== */

                status.textContent =
                    "COMMAND AUTHORIZED...";


                setTimeout(
                    function() {

                        window.location.href =
                            "./game.html";

                    },
                    300
                );


            }


            catch (fout) {


                console.error(
                    "Onverwachte login fout:",
                    fout
                );


                status.textContent =
                    "Er ging iets mis bij het inloggen.";

            }

        }



        /* =====================================================
           ENTER / ESCAPE
           ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {


                const overlay =
                    document.getElementById(
                        "loginOverlay"
                    );


                if (
                    event.key === "Enter" &&
                    overlay.style.display === "flex"
                ) {

                    login();

                }


                if (
                    event.key === "Escape" &&
                    overlay.style.display === "flex"
                ) {

                    closeLogin();

                }

            }
        );


    </script>


</body>

</html>
