```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Conquest</title>

    <link rel="stylesheet" href="./style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- STARTSCHERM -->

    <div class="start-screen">

        <h1>GLOBAL CONQUEST</h1>

        <p>COMMAND • CONQUER • SURVIVE</p>

        <button onclick="openLogin()" class="play-button">
            ▶
        </button>

        <div>PLAY</div>

    </div>


    <!-- LOGIN -->

    <div id="loginOverlay" class="login-overlay">

        <div class="login-box">

            <h2>COMMANDER LOGIN</h2>

            <input
                id="naam"
                type="text"
                placeholder="Account name"
                autocomplete="username"
            >

            <input
                id="wachtwoord"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button onclick="login()">
                LOGIN
            </button>

            <button onclick="closeLogin()" class="close-login">
                CANCEL
            </button>

            <p id="loginStatus"></p>

        </div>

    </div>


    <script>

        /* ==============================
           SUPABASE
           ============================== */

        const supabaseUrl =
            "https://qelqaiczgibxyxfqtapg.supabase.co";

        const supabaseKey =
            "sb_publishable_aZSOOfRnROvePvZ2WWNv8g_ZhfZTCes";

        const database =
            window.supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        /* ==============================
           LOGIN OPENEN
           ============================== */

        function openLogin() {

            document
                .getElementById("loginOverlay")
                .style.display = "flex";

            document
                .getElementById("naam")
                .focus();
        }


        /* ==============================
           LOGIN SLUITEN
           ============================== */

        function closeLogin() {

            document
                .getElementById("loginOverlay")
                .style.display = "none";

            document
                .getElementById("loginStatus")
                .textContent = "";
        }


        /* ==============================
           INLOGGEN
           ============================== */

        async function login() {

            const naam =
                document
                    .getElementById("naam")
                    .value
                    .trim();

            const wachtwoord =
                document
                    .getElementById("wachtwoord")
                    .value;


            const status =
                document.getElementById(
                    "loginStatus"
                );


            if (!naam || !wachtwoord) {

                status.textContent =
                    "Vul je accountnaam en wachtwoord in.";

                return;
            }


            status.textContent =
                "LOGINNING...";


            try {

                const {
                    data,
                    error
                } = await database.functions.invoke(
                    "login",
                    {
                        body: {
                            naam: naam,
                            wachtwoord: wachtwoord
                        }
                    }
                );


                if (error) {

                    console.error(error);

                    status.textContent =
                        "Login mislukt.";

                    return;
                }


                if (
                    !data ||
                    !data.success
                ) {

                    status.textContent =
                        "Verkeerde accountnaam of wachtwoord.";

                    return;
                }


                /*
                 * Alleen de accountnaam bewaren.
                 * Het wachtwoord wordt NIET opgeslagen.
                 */

                const spelerNaam =
                    data.speler_naam || naam;


                sessionStorage.setItem(
                    "globalConquestPlayer",
                    spelerNaam
                );


                /*
                 * Naar de echte game.
                 */

                window.location.href =
                    "./game.html";

            }

            catch (fout) {

                console.error(
                    "Login fout:",
                    fout
                );

                status.textContent =
                    "Er ging iets mis bij het inloggen.";
            }
        }


        /* ==============================
           ENTER = LOGIN
           ============================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    const overlay =
                        document.getElementById(
                            "loginOverlay"
                        );

                    if (
                        overlay.style.display ===
                        "flex"
                    ) {

                        login();
                    }
                }


                if (
                    event.key === "Escape"
                ) {

                    closeLogin();
                }

            }
        );

    </script>

</body>
</html>
```
