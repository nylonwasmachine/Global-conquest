<script>
    const supabaseUrl =
        "https://qelqaiczgibxyxfqtapg.supabase.co";

    const supabaseKey =
        "sb_publishable_aZSOOfRnROvePvZ2WWNv8g_ZhfZTCes";

    const database =
        window.supabase.createClient(
            supabaseUrl,
            supabaseKey
        );


    const speler =
        sessionStorage.getItem("globalConquestPlayer");


    if (!speler) {
        window.location.href = "./index.html";
    }


    document.getElementById("commanderName").textContent =
        speler || "---";


    function parsePunten(value) {

        if (value === null || value === undefined) {
            return 0;
        }

        let tekst = String(value)
            .trim()
            .toUpperCase()
            .replace(",", ".");

        if (!tekst) {
            return 0;
        }

        let multiplier = 1;

        if (tekst.endsWith("K")) {
            multiplier = 1000;
            tekst = tekst.slice(0, -1);
        }

        if (tekst.endsWith("M")) {
            multiplier = 1000000;
            tekst = tekst.slice(0, -1);
        }

        const nummer = Number(tekst);

        if (Number.isNaN(nummer)) {
            return 0;
        }

        return nummer * multiplier;
    }


    async function laadSpeler() {

        if (!speler) return;

        const { data, error } = await database
            .from("players")
            .select("naam, plus, min")
            .eq("naam", speler)
            .maybeSingle();


        if (error) {
            console.error("Speler laden mislukt:", error);
            return;
        }


        if (!data) {
            document.getElementById("points").textContent = "0";
            return;
        }


        const plus =
            parsePunten(data.plus);

        const min =
            Math.abs(parsePunten(data.min));

        const totaal =
            plus - min;


        document.getElementById("points").textContent =
            Math.max(0, Math.floor(totaal)).toLocaleString("nl-NL");
    }


    laadSpeler();


    database
        .channel("global-conquest-world-players")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "players"
            },
            function () {
                laadSpeler();
            }
        )
        .subscribe();


    // LAND KIEZEN

    const countryCards =
        document.querySelectorAll(".country-card");

    const selectedCountry =
        document.getElementById("selectedCountry");


    countryCards.forEach(function(card) {

        card.addEventListener("click", function() {

            countryCards.forEach(function(otherCard) {
                otherCard.classList.remove("selected");
            });


            card.classList.add("selected");


            const country =
                card.dataset.country;


            selectedCountry.textContent =
                country.toUpperCase();


            sessionStorage.setItem(
                "globalConquestNation",
                country
            );

        });

    });


    // TERUG

    document.getElementById("backButton")
        .addEventListener("click", function() {

            window.location.href =
                "./game.html";

        });
</script>
