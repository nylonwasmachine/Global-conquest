           BASIS
        ===================================================== */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .gc-world {
            width: 100vw;
            height: 100vh;
            background: #071018;
            color: #f4f7f8;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================================
           TOPBAR
        ===================================================== */

        .gc-topbar {
            height: 72px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;
            box-sizing: border-box;

            background: #0b151e;
            border-bottom: 1px solid #263642;

            position: relative;
            z-index: 100;
        }

        .gc-logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .gc-logo span {
            display: block;
            margin-top: 4px;
            font-size: 9px;
            letter-spacing: 4px;
            opacity: .55;
        }

        .gc-commander {
            font-size: 12px;
            letter-spacing: 1px;
        }

        .gc-commander strong {
            margin-left: 6px;
        }

        .gc-back {
            border: 1px solid #465966;
            background: #101e28;
            color: white;
            padding: 11px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .gc-back:hover {
            background: #1a2b38;
        }


        /* =====================================================
           HOOFDLAYOUT
        ===================================================== */

        .gc-world-layout {
            width: 100vw;
            height: calc(100vh - 72px);

            display: flex;

            overflow: hidden;
        }


        /* =====================================================
           LINKERPANEEL
        ===================================================== */

        .gc-left-panel {
            width: 320px;
            min-width: 320px;
            height: 100%;

            box-sizing: border-box;

            background: #0a141c;
            border-right: 1px solid #2b3d49;

            overflow-y: auto;
            overflow-x: hidden;

            position: relative;
            z-index: 90;
        }


        /* =====================================================
           RESOURCES
        ===================================================== */

        .gc-resources {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1px;
            background: #2b3d49;
        }

        .gc-resource {
            padding: 14px 18px;
            background: #0d1a23;
        }

        .gc-resource span {
            display: block;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: .55;
        }

        .gc-resource strong {
            display: block;
            margin-top: 5px;
            font-size: 20px;
        }


        /* =====================================================
           SELECTIE
        ===================================================== */

        .gc-selection {
            margin: 15px;
            padding: 14px;

            border: 1px solid #344956;
            background: #0e1c26;
        }

        .gc-small-title {
            font-size: 9px;
            letter-spacing: 2px;
            opacity: .5;
        }

        .gc-current {
            margin-top: 9px;
            font-size: 14px;
            font-weight: 900;
        }

        .gc-city-selected {
            margin-top: 8px;
            font-size: 11px;
            opacity: .7;
        }

           POWER LIJST
        ===================================================== */

        .gc-country-title {
            padding: 12px 15px;

            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;

            border-top: 1px solid #263944;
            border-bottom: 1px solid #263944;
        }

        .gc-list-continent {
            padding: 12px 15px 6px;

            font-size: 9px;
            letter-spacing: 2px;

            color: #7e929e;
        }

        .gc-country-list {
            padding-bottom: 30px;
        }

        .gc-power-button {
            width: calc(100% - 20px);

            min-height: 42px;

            display: flex;
            align-items: center;

            gap: 11px;

            text-align: left;

            border: 1px solid transparent;

            background: #0d1a23;
            color: white;

            cursor: pointer;

            padding: 8px 10px;

            font-weight: 700;
        }

            background: #162731;
            border-color: #3c5360;
        }

        .gc-power-button.active {
            background: #1a3340;
            border-color: #8faebb;
        }

        .gc-power-button.special {
            border-left: 3px solid #c8a84e;
        }

        .gc-power-flag {
            font-size: 20px;
            min-width: 38px;
        }

           KAARTGEBIED
           VOLLEDIG ALLES RECHTS VAN DE LINKERBALK
        ===================================================== */

            min-width: 0;
            min-height: 0;

            height: 100%;

            position: relative;

            overflow: hidden;

           ZWEVENDE KAART HEADER

        ===================================================== */

            left: 16px;
            right: 16px;

            align-items: center;
            justify-content: space-between;

            border: 1px solid #334753;

            z-index: 50;

            font-size: 9px;
            letter-spacing: 3px;
            opacity: .5;
        }

            font-size: 11px;

            color: white;

            letter-spacing: 1px;

            cursor: pointer;

            white-space: nowrap;

        }

            opacity: .35;

            cursor: not-allowed;
        }

           KAARTCONTAINER
           VULT 100% VAN HET RECHTERGEBIED
        ===================================================== */

        .gc-map-container {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: block;
        }

           LANDEN
        ===================================================== */

        .gc-map-country {
            fill: #c5cecd;

            stroke: #839294;

            stroke-width: .45;
        }

        .gc-map-country.selected-territory {
            fill: #596f78;

            stroke: #263b44;

            stroke-width: 1.2;
        }

        .gc-map-borders {
            fill: none;

            stroke: #758486;

            stroke-width: .5;

            pointer-events: none;
        }


        /* =====================================================
           STEDEN
        ===================================================== */

        .gc-city-marker {
            cursor: pointer;
        }

        .gc-city-marker circle {
            fill: #142832;

            stroke: white;

            stroke-width: 2;
        }

        .gc-city-marker .gc-city-inner {
            fill: white;

            stroke: none;
        }

        .gc-city-marker text {
            font-size: 11px;

            font-weight: 900;

            fill: #101b20;

            paint-order: stroke;

            stroke: white;

            stroke-width: 4px;

            stroke-linejoin: round;

            pointer-events: none;
        }

        .gc-city-marker:hover circle {
            r: 12;
        }

        .gc-city-marker.chosen circle {
            fill: #d0ad4c;

            stroke: #17252c;

            stroke-width: 3;
        }

        }

           LOADING
        ===================================================== */

const supabaseUrl =

const supabaseKey =
    "sb_publishable_aZSOOfRnROvePvZ2WWNv8g_ZhfZTCes";

const database =
    window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


/* =========================================================
   SPELER
========================================================= */

const speler =
    sessionStorage.getItem(
        "globalConquestPlayer"
    );

if (!speler) {

    window.location.href =
        "./index.html";

}

document
    .getElementById("commanderName")
    .textContent =
        speler || "---";


/* =========================================================
   PUNTEN
========================================================= */

function parsePunten(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return 0;
    }

    let tekst =
        String(value)
            .trim()
            .toUpperCase()
            .replace(",", ".");

    if (!tekst) {
        return 0;
    }

    let multiplier = 1;

    if (tekst.endsWith("K")) {

        multiplier = 1000;

        tekst =
            tekst.slice(0, -1);

    }

    if (tekst.endsWith("M")) {

        multiplier = 1000000;

        tekst =
            tekst.slice(0, -1);

    }

    const nummer =
        Number(tekst);

    return Number.isNaN(nummer)
        ? 0
        : nummer * multiplier;

}


async function laadSpeler() {

    if (!speler) {
        return;
    }

    const { data, error } =
        await database
            .from("players")
            .select(
                "naam, plus, min"
            )
            .eq(
                "naam",
                speler
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Speler laden mislukt:",
            error
        );

        return;
    }


    if (!data) {

        document
            .getElementById("points")
            .textContent =
                "0";

        return;
    }


    const plus =
        parsePunten(data.plus);

    const min =
        Math.abs(
            parsePunten(data.min)
        );


    const totaal =
        Math.max(
            0,
            plus - min
        );


    document
        .getElementById("points")
        .textContent =
            Math.floor(totaal)
                .toLocaleString("nl-NL");

}


laadSpeler();


database
    .channel(
        "global-conquest-world-players"
    )
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "players"
        },
        function () {
            laadSpeler();
        }
    )

/* =========================================================

========================================================= */

function maakLandLijst() {

    countryList.innerHTML = "";


    continentOrder.forEach(
        function(continent) {

            const continentPowers =
                powers.filter(
                    function(power) {

                        return power.continent
                            .split(" / ")
                            .includes(continent);

                    }
                );


            if (
                !continentPowers.length
            ) {
                return;
            }


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "gc-list-continent";

            title.textContent =
                continent;

            countryList.appendChild(
                title
            );


            continentPowers.forEach(
                function(power) {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "gc-power-button";


                    if (power.special) {

                        button.classList.add(
                            "special"
                        );

                    }


                    button.innerHTML = `
                        <span class="gc-power-flag">
                            ${power.flag}
                        </span>

                        <span>
                            ${power.name}
                        </span>
                    `;


                    button.addEventListener(
                        "click",
                        function() {

                            kiesMacht(
                                power
                            );


                            document
                                .querySelectorAll(
                                    ".gc-power-button"
                                )
                                .forEach(
                                    function(other) {

                                        other.classList.remove(
                                            "active"
                                        );

                                    }
                                );


                            button.classList.add(
                                "active"
                            );

                        }
                    );


                    countryList.appendChild(
                        button
                    );

                }
            );

        }
    );

}


maakLandLijst();


/* =========================================================
   MACHT KIEZEN
========================================================= */

function kiesMacht(power) {

    currentPower =
        power;

    currentCity =
        null;


    selectedPower.textContent =
        power.name.toUpperCase();


    selectedCity.textContent =
        "KLIK OP EEN STAD";


    mapTitle.textContent =
        power.flag +
        " " +
        power.name;


    mapInstruction.textContent =
        "Klik op één van de 7 strategische steden.";


    selectCityButton.disabled =
        true;


    selectCityButton.textContent =
        "SELECTEER STAD";


    tekenKaart();

}


/* =========================================================
   WERELDKAART LADEN
========================================================= */

async function laadWereld() {

    try {

        const response =
            await fetch(
                "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json"
            );


        if (!response.ok) {

            throw new Error(
                "Wereldkaart kon niet geladen worden."
            );

        }


        worldData =
            await response.json();


        loading.style.display =
            "none";


        tekenKaart();


    } catch (error) {

        console.error(
            error
        );


        loading.textContent =
            "WERELDKAART KON NIET WORDEN GELADEN.";

    }

}


/* =========================================================
   NAAM NORMALISEREN
========================================================= */

function normaliseerNaam(name) {

    return String(name)
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        );

}


/* =========================================================
   CONTROLEREN OF LAND BIJ MACHT HOORT
========================================================= */

function countryIsPartOfPower(
    countryName
) {

    if (!currentPower) {
        return false;
    }


    const wanted =
        currentPower.countries
            .map(
                normaliseerNaam
            );


    return wanted.includes(
        normaliseerNaam(
            countryName
        )
    );

}


/* =========================================================
   KAART TEKENEN
========================================================= */

function tekenKaart() {

    if (!worldData) {
        return;
    }


    const width =
        mapContainer.clientWidth;


    const height =
        mapContainer.clientHeight;


    if (
        width <= 0 ||
        height <= 0
    ) {
        return;
    }


    svg
        .attr(
            "width",
            width
        )
        .attr(
            "height",
            height
        )
        .attr(
            "viewBox",
            `0 0 ${width} ${height}`
        );


    svg
        .selectAll("*")
        .remove();


    const world =
        topojson.feature(
            worldData,
            worldData.objects.countries
        );


    /* =====================================================
       KAARTPROJECTION
       VOLLEDIGE RECHTERKANT
    ===================================================== */

    const projection =
        d3.geoNaturalEarth1();


    projection.fitExtent(
        [
            [20, 20],
            [
                width - 20,
                height - 20
            ]
        ],
        world
    );


    const path =
        d3.geoPath()
            .projection(
                projection
            );


    /* =====================================================
       ALLE LANDEN
    ===================================================== */

    svg
        .append("g")
        .selectAll("path")
        .data(
            world.features
        )
        .join("path")
        .attr(
            "class",
            "gc-map-country"
        )
        .attr(
            "d",
            path
        );


    /* =====================================================
       SAMENGEVOEGDE GEBIEDEN
    ===================================================== */

    if (currentPower) {

        svg
            .append("g")
            .selectAll("path")
            .data(
                world.features.filter(
                    function(feature) {

                        return countryIsPartOfPower(
                            feature.properties.name
                        );

                    }
                )
            )
            .join("path")
            .attr(
                "class",
                "gc-map-country selected-territory"
            )
            .attr(
                "d",
                path
            );

    }


    /* =====================================================
       LANDGRENZEN
    ===================================================== */

    svg
        .append("path")
        .datum(
            topojson.mesh(
                worldData,
                worldData.objects.countries,
                function(a, b) {

                    return a !== b;

                }
            )
        )
        .attr(
            "class",
            "gc-map-borders"
        )
        .attr(
            "d",
            path
        );


    /* =====================================================
       STEDEN
    ===================================================== */

    if (!currentPower) {
        return;
    }


    const cityGroup =
        svg
            .append("g")
            .attr(
                "class",
                "gc-city-layer"
            );


    currentPower.cities.forEach(
        function(
            city,
            index
        ) {

            const cityName =
                city[0];

            const longitude =
                city[1];

            const latitude =
                city[2];


            const coordinates =
                projection(
                    [
                        longitude,
                        latitude
                    ]
                );


            if (!coordinates) {
                return;
            }


            const x =
                coordinates[0];

            const y =
                coordinates[1];


            const cityNode =
                cityGroup
                    .append("g")
                    .attr(
                        "class",
                        "gc-city-marker"
                    )
                    .attr(
                        "transform",
                        `translate(${x},${y})`
                    )
                    .on(
                        "click",
                        function(event) {

                            event.stopPropagation();

                            kiesStad(
                                cityName,
                                index
                            );

                        }
                    );


            cityNode
                .append("circle")
                .attr(
                    "r",
                    9
                );


            cityNode
                .append("circle")
                .attr(
                    "class",
                    "gc-city-inner"
                )
                .attr(
                    "r",
                    4
                );


            cityNode
                .append("text")
                .attr(
                    "x",
                    13
                )
                .attr(
                    "y",
                    4
                )
                .text(
                    cityName
                );

        }
    );

}


/* =========================================================
   STAD KIEZEN
========================================================= */

function kiesStad(
    cityName,
    cityIndex
) {

    if (!currentPower) {
        return;
    }


    currentCity = {
        name: cityName,
        index: cityIndex
    };


    selectedCity.textContent =
        cityName.toUpperCase();


    mapInstruction.textContent =
        cityName +
        " geselecteerd. Bevestig hieronder.";


    selectCityButton.disabled =
        false;


    document
        .querySelectorAll(
            ".gc-city-marker"
        )
        .forEach(
            function(
                marker,
                index
            ) {

                marker.classList.toggle(
                    "chosen",
                    index === cityIndex
                );

            }
        );

}


/* =========================================================
   STAD BEVESTIGEN
========================================================= */

selectCityButton.addEventListener(
    "click",
    function() {

        if (
            !currentPower ||
            !currentCity
        ) {
            return;
        }


        sessionStorage.setItem(
            "globalConquestNation",
            currentPower.name
        );


        sessionStorage.setItem(
            "globalConquestCapital",
            currentCity.name
        );


        mapInstruction.textContent =
            currentCity.name +
            " is jouw startgebied.";


        selectCityButton.textContent =
            "STARTGEBIED GESELECTEERD";


        selectCityButton.disabled =
            true;


        alert(
            "STARTGEBIED GESELECTEERD\n\n" +
            currentPower.name +
            "\n" +
            currentCity.name
        );

    }
);


/* =========================================================
   TERUG NAAR COMMAND CENTER
========================================================= */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "./game.html";

        }
    );


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (worldData) {
            tekenKaart();
        }

    }
);


/* =========================================================
   START
========================================================= */

laadWereld();

</script>
