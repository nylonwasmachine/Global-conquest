<style>

/* =========================================================
   WORLD SELECT
   ========================================================= */

.world-select-screen {
    min-height: 100vh;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,150,.08),
            transparent 55%
        ),
        #020604;
}

.world-select-grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0,255,150,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,150,.045) 1px,
            transparent 1px
        );

    background-size: 40px 40px;
}

.world-select-scanlines {
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 4px,
            rgba(0,0,0,.13) 5px
        );

    pointer-events: none;
}


/* =========================================================
   HEADER
   ========================================================= */

.world-header {
    position: relative;
    z-index: 5;

    height: 70px;

    display: flex;
    align-items: center;

    padding: 0 25px;

    border-bottom:
        1px solid rgba(0,255,150,.2);

    background:
        rgba(3,10,7,.96);
}

.world-logo {
    color: #bffff0;

    font-weight: bold;

    letter-spacing: 4px;
}

.world-logo span {
    color: #52ffad;
}

.world-commander {
    margin-left: auto;
    margin-right: 25px;

    color: #4e7865;

    font-size: 9px;
    letter-spacing: 2px;
}

.world-commander strong {
    color: #9bffd1;
}

.world-back {
    padding: 9px 14px;

    background: transparent;

    border: 1px solid #294a39;

    color: #608b75;

    font-family: inherit;
    font-size: 9px;

    cursor: pointer;
}

.world-back:hover {
    border-color: #52ffad;
    color: #9dffd0;
}


/* =========================================================
   LAYOUT
   ========================================================= */

.world-layout {
    position: relative;
    z-index: 2;

    min-height:
        calc(100vh - 70px);

    display: grid;

    grid-template-columns:
        230px 1fr;
}


/* =========================================================
   STATS
   ========================================================= */

.world-stats {
    border-right:
        1px solid rgba(0,255,150,.18);

    background:
        rgba(2,9,6,.9);

    padding: 25px 18px;
}

.world-stats-title {
    color: #4e806a;

    font-size: 9px;
    letter-spacing: 3px;

    margin-bottom: 22px;
}

.world-stat {
    padding: 16px 12px;

    margin-bottom: 12px;

    background:
        rgba(0,255,150,.025);

    border:
        1px solid rgba(0,255,150,.12);
}

.world-stat-label {
    color: #4e7965;

    font-size: 8px;
    letter-spacing: 2px;
}

.world-stat-value {
    color: #a9ffda;

    font-size: 25px;
    font-weight: bold;

    margin-top: 8px;
}

.world-stat-line {
    height: 1px;

    margin-top: 13px;

    background:
        rgba(0,255,150,.1);
}


/* =========================================================
   CENTER
   ========================================================= */

.world-select-center {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 30px;
}

.world-select-content {
    width: min(850px, 100%);

    text-align: center;
}

.world-select-status {
    color: #6affbd;

    font-size: 10px;
    letter-spacing: 4px;

    margin-bottom: 18px;
}

.world-select-status .status-dot {
    margin-right: 8px;
}

.world-select-content h1 {
    color: #dffff0;

    font-size: clamp(
        55px,
        9vw,
        105px
    );

    line-height: .82;

    letter-spacing: 7px;

    text-shadow:
        0 0 25px rgba(0,255,150,.18);
}

.world-select-content h1 span {
    color: #52ffad;
}

.world-title-line {
    width: 260px;
    height: 1px;

    margin: 30px auto 20px;

    background: #52ffad;

    box-shadow:
        0 0 15px #52ffad;
}

.world-select-description {
    color: #5e9078;

    font-size: 10px;

    letter-spacing: 2px;

    line-height: 1.8;

    max-width: 570px;

    margin: 0 auto 30px;
}


/* =========================================================
   CHOOSE BUTTON
   ========================================================= */

.choose-country-button {
    display: inline-flex;

    align-items: center;

    gap: 25px;

    padding: 16px 32px;

    background:
        rgba(0,255,150,.06);

    border:
        1px solid #52ffad;

    color: #8bffca;

    font-family: inherit;

    font-weight: bold;

    letter-spacing: 3px;

    cursor: pointer;

    transition: .2s;
}

.choose-country-button:hover {
    background:
        rgba(0,255,150,.15);

    box-shadow:
        0 0 30px rgba(0,255,150,.2);

    transform:
        translateY(-2px);
}

.choose-country-button .arrow {
    font-size: 18px;
}

.choose-country-button:disabled {
    cursor: not-allowed;
}


/* =========================================================
   SELECTED COUNTRY
   ========================================================= */

.selected-country {
    display: none;

    width: min(500px, 100%);

    margin: 25px auto 0;

    padding: 16px;

    text-align: left;

    border:
        1px solid rgba(0,255,150,.25);

    background:
        rgba(0,255,150,.035);
}

.selected-country.show {
    display: block;
}

.selected-label {
    color: #4f806b;

    font-size: 8px;

    letter-spacing: 2px;
}

.selected-name {
    color: #bffff0;

    font-size: 17px;

    font-weight: bold;

    margin-top: 7px;
}

.selected-region {
    color: #527d68;

    font-size: 9px;

    margin-top: 5px;

    letter-spacing: 1px;
}


/* =========================================================
   LOAD MAP
   ========================================================= */

.load-map-button {
    display: none;

    margin-top: 15px;

    padding: 13px 25px;

    border:
        1px solid #52ffad;

    background:
        rgba(0,255,150,.08);

    color: #7dffc2;

    font-family: inherit;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;
}

.load-map-button.show {
    display: inline-block;
}

.load-map-button:hover {
    background:
        rgba(0,255,150,.18);

    box-shadow:
        0 0 20px rgba(0,255,150,.18);
}


/* =========================================================
   COUNTRY OVERLAY
   ========================================================= */

.country-overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(0,5,3,.92);
}

.country-overlay.show {
    display: flex;
}

.country-grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0,255,150,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,150,.045) 1px,
            transparent 1px
        );

    background-size: 35px 35px;
}

.country-window {
    position: relative;

    z-index: 2;

    width: min(850px, 100%);

    max-height: 82vh;

    display: flex;

    flex-direction: column;

    background:
        rgba(3,11,7,.98);

    border:
        1px solid rgba(0,255,150,.35);

    box-shadow:
        0 0 60px rgba(0,0,0,.7);
}

.country-window::before,
.country-window::after {
    content: "";

    position: absolute;

    width: 16px;
    height: 16px;

    border-color: #52ffad;
}

.country-window::before {
    top: -1px;
    left: -1px;

    border-top: 2px solid;
    border-left: 2px solid;
}

.country-window::after {
    right: -1px;
    bottom: -1px;

    border-right: 2px solid;
    border-bottom: 2px solid;
}

.country-window-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 20px;

    border-bottom:
        1px solid rgba(0,255,150,.16);
}

.country-window-title {
    color: #bffff0;

    font-size: 18px;

    font-weight: bold;

    letter-spacing: 3px;
}

.country-window-subtitle {
    color: #4e806a;

    font-size: 8px;

    letter-spacing: 2px;

    margin-top: 5px;
}

.close-country {
    background: transparent;

    border: none;

    color: #608b75;

    font-family: inherit;

    font-size: 20px;

    cursor: pointer;
}

.close-country:hover {
    color: #9dffd0;
}


/* =========================================================
   COUNTRY LIST
   ========================================================= */

.country-list {
    overflow-y: auto;

    padding: 18px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.country-option {
    padding: 15px;

    text-align: left;

    background:
        rgba(0,255,150,.025);

    border:
        1px solid rgba(0,255,150,.12);

    color: #a8d6bf;

    font-family: inherit;

    cursor: pointer;

    transition: .15s;
}

.country-option:hover {
    background:
        rgba(0,255,150,.08);

    border-color:
        rgba(0,255,150,.4);
}

.country-option.active {
    border-color: #52ffad;

    background:
        rgba(0,255,150,.11);

    box-shadow:
        0 0 18px rgba(0,255,150,.08);
}

.country-option-name {
    color: #cffff0;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;
}

.country-option-region {
    color: #527d68;

    font-size: 8px;

    letter-spacing: 1px;

    margin-top: 6px;
}


/* =========================================================
   FOOTER
   ========================================================= */

.country-window-footer {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    padding: 15px 18px;

    border-top:
        1px solid rgba(0,255,150,.16);
}

.country-selected-text {
    color: #4e806a;

    font-size: 9px;

    letter-spacing: 1px;
}

.country-selected-text strong {
    color: #9dffd0;
}

.select-country-button {
    padding: 12px 25px;

    background:
        rgba(0,255,150,.08);

    border:
        1px solid #52ffad;

    color: #7dffc2;

    font-family: inherit;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;
}

.select-country-button:disabled {
    opacity: .3;
    cursor: not-allowed;
}

.select-country-button:not(:disabled):hover {
    background:
        rgba(0,255,150,.18);
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:800px) {

    .world-layout {
        grid-template-columns: 1fr;
    }

    .world-stats {
        border-right: none;

        border-bottom:
            1px solid rgba(0,255,150,.18);

        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 8px;

        padding: 12px;
    }

    .world-stats-title {
        display: none;
    }

    .world-stat {
        margin: 0;
    }

    .world-commander {
        display: none;
    }

    .world-select-center {
        min-height:
            calc(100vh - 175px);
    }

    .country-list {
        grid-template-columns: 1fr;
    }
}

@media(max-width:500px) {

    .world-header {
        padding: 0 15px;
    }

    .world-logo {
        font-size: 11px;
    }

    .world-select-center {
        padding: 20px 15px;
    }

    .world-select-content h1 {
        font-size: 47px;
        letter-spacing: 4px;
    }

    .world-select-description {
        font-size: 8px;
    }

    .country-overlay {
        padding: 10px;
    }

    .country-window-footer {
        flex-direction: column;
        align-items: stretch;
    }

    .select-country-button {
        width: 100%;
    }
}

</style>

</head>

<div class="world-select-screen">

        </div>

        <button

            ← BACK
        </button>

    </header>


    <!-- =====================================================
         MAIN LAYOUT
         ===================================================== -->

    <div class="world-layout">


        <!-- =================================================
             STATS
             ================================================= -->

        <aside class="world-stats">

            <div class="world-stats-title">
                COMMAND RESOURCES
            </div>


            <div class="world-stat">

                <div class="world-stat-label">
                    POINTS
                </div>

                <div
                    class="world-stat-value"
                    id="points">
                    0
                </div>

                <div class="world-stat-line"></div>

            </div>

                    MANPOWER

                    0

            </div>


            <div class="world-stat">

                <div class="world-stat-label">
                    FACTORIES
                </div>

                <div
                    class="world-stat-value"
                    id="factories">
                    0
                </div>

                <div class="world-stat-line"></div>

            </div>

        </aside>


        <!-- =================================================
             CENTER
             ================================================= -->

        <main class="world-select-center">

            <section class="world-select-content">

                <div class="world-select-status">
                    <span class="status-dot">●</span>
                    WORLD COMMAND READY
                </div>


                <h1>
                    CHOOSE<br>
                    <span>COUNTRY</span>
                </h1>


                <div class="world-title-line"></div>


                <p class="world-select-description">
                    SELECT A POWER TO BEGIN YOUR CONQUEST.
                    EACH POWER CONTROLS SEVEN STRATEGIC
                    CONQUEST ZONES.
                </p>


                <button
                    class="choose-country-button"
                    id="chooseCountryButton">

                    CHOOSE COUNTRY

                    <span class="arrow">→</span>

                </button>


                <div
                    class="selected-country"
                    id="selectedCountry">

                    <div class="selected-label">
                        SELECTED POWER
                    </div>

                    <div
                        class="selected-name"
                        id="selectedName">
                    </div>

                    <div
                        class="selected-region"
                        id="selectedRegion">
                    </div>

                </div>


                <button
                    class="load-map-button"
                    id="loadMapButton">

                    LOAD MAP →

                </button>

            </section>

        </main>

    </div>

</div>


<!-- =========================================================
     COUNTRY SELECT WINDOW
     ========================================================= -->

<div
    class="country-overlay"
    id="countryOverlay">

    <div class="country-grid"></div>


    <div class="country-window">

        <div class="country-window-header">

            <div>

                <div class="country-window-title">
                    CHOOSE COUNTRY
                </div>

                <div class="country-window-subtitle">
                    SELECT YOUR WORLD POWER
                </div>

            </div>


            <button
                class="close-country"
                id="closeCountry">

                ×

            </button>

        </div>


        <div
            class="country-list"
            id="countryList">
        </div>


        <div class="country-window-footer">

            <div class="country-selected-text">

                SELECTED:

                <strong id="countrySelectedText">
                    NONE
                </strong>

            </div>


            <button
                class="select-country-button"
                id="selectCountryButton"
                disabled>

                SELECT

            </button>

        </div>

    </div>

</div>

/* =========================================================
   ACCOUNT ROLE
   ========================================================= */

async function checkAccountRole() {

    isGovernment = false;

    try {

        const result =
            await database.rpc(
                "get_player_from_session",
                {
                    p_token:
                        sessionToken
                }
            );

        const data =
            result.data;

        const error =
            result.error;

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error(
                "Geen speler ontvangen."
            );
        }

        const role =
            String(
                data.account_role || ""
            ).toLowerCase();

        const name =
            String(
                data.naam || ""
            ).toLowerCase();

        if (
            role === "government" &&
            name === "overheid"
        ) {

            isGovernment = true;

        }

        console.log(
            "Account:",
            data.naam,
            "Role:",
            data.account_role
        );

    } catch (error) {

        console.error(
            "Account role kon niet worden geladen:",
            error
        );

        isGovernment = false;

    }

}

/* =========================================================

   ========================================================= */

async function loadOccupiedCountries() {

    occupiedCountries =
        new Map();

    if (!activeWW3) {
        return;
    }

    try {

        const result =
            await database.rpc(
                "get_ww3_countries"
            );

        const data =
            result.data;

        const error =
            result.error;

        if (error) {
            throw error;
        }

        (data || []).forEach(
            row => {

                if (
                    row.country_id
                ) {

                    occupiedCountries.set(
                        row.country_id,
                        row.player_name
                    );

                }

            }
        );

    } catch (error) {

        console.error(
            "Bezettingen konden niet worden geladen:",
            error
        );

    }

}

/* =========================================================
   RENDER COUNTRY LIST
   ========================================================= */

function renderCountryList() {

    countryList.innerHTML = "";

    const sortedPowers =
        [...powers].sort(
            (a, b) => {

                const aTaken =
                    occupiedCountries.has(
                        a.id
                    );

                const bTaken =
                    occupiedCountries.has(
                        b.id
                    );

                if (
                    aTaken === bTaken
                ) {
                    return 0;
                }

                return aTaken
                    ? 1
                    : -1;

            }
        );


    sortedPowers.forEach(
        power => {

            const isTaken =
                occupiedCountries.has(
                    power.id
                );

            const owner =
                occupiedCountries.get(
                    power.id
                );


            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "country-option";


            if (isTaken) {

                button.disabled =
                    true;

                button.style.opacity =
                    "0.45";

                button.style.cursor =
                    "not-allowed";

            }


            button.innerHTML = `
                <div class="country-option-name">
                    ${power.flag} ${power.name}
                </div>

                <div class="country-option-region">
                    ${
                        isTaken
                            ? `BEZET — ${owner || "UNKNOWN"}`
                            : `${power.region} · 7 CONQUEST ZONES`
                    }
                </div>
            `;


            if (!isTaken) {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".country-option"
                            )
                            .forEach(
                                element => {

                                    element.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        button.classList.add(
                            "active"
                        );


                        selectedPower =
                            power;


                        countrySelectedText.textContent =
                            `${power.flag} ${power.name}`;


                        selectCountryButton.disabled =
                            false;

                    }
                );

            }


            countryList.appendChild(
                button
            );

        }
    );

}

/* =========================================================
   CREATE WW3
   ========================================================= */

async function createWW3() {

    if (!isGovernment) {

        alert(
            "Alleen Overheid kan WW3 starten."
        );

        return;
    }


    chooseCountryButton.disabled =
        true;


    try {

        const result =
            await database.rpc(
                "create_ww3",
                {
                    p_token:
                        sessionToken
                }
            );

        const data =
            result.data;

        const error =
            result.error;

        if (error) {
            throw error;
        }


        activeWW3 =
            data;


        await refreshWW3();


        alert(
            "WW3 is gestart."
        );

    } catch (error) {

        console.error(
            "WW3 starten mislukt:",
            error
        );

        alert(
            error.message ||
            "WW3 kon niet worden gestart."
        );

        chooseCountryButton.disabled =
            false;

        await refreshWW3();

    }

}


/* =========================================================
   JOIN WW3
   ========================================================= */

async function joinWW3(power) {

    if (!power) {
        return;
    }


    if (!activeWW3) {

        alert(
            "Er is momenteel geen actieve WW3."
        );

        return;
    }


    if (myWW3) {

        alert(
            "Je hebt al een land in deze WW3."
        );

        return;
    }


    selectCountryButton.disabled =
        true;


    try {

        const result =
            await database.rpc(
                "join_ww3",
                {
                    p_token:
                        sessionToken,

                    p_country_id:
                        power.id
                }
            );

        const data =
            result.data;

        const error =
            result.error;

        if (error) {
            throw error;
        }


        /*
         * SERVER HEEFT LAND GOEDGEKEURD
         */

        setLocalNation(
            power
        );


        myWW3 =
            data;


        showSelectedPower(
            power
        );


        countryOverlay.classList.remove(
            "show"
        );


        await refreshWW3();


    } catch (error) {

        console.error(
            "Land kiezen mislukt:",
            error
        );


        alert(
            error.message ||
            "Dit land kon niet worden gekozen."
        );


        await refreshWW3();

    } finally {

        selectCountryButton.disabled =
            !selectedPower;

    }

}


/* =========================================================
   LEAVE WW3
   ========================================================= */

async function leaveWW3() {

    if (!myWW3) {
        return;
    }


    const confirmed =
        confirm(
            "Weet je zeker dat je je huidige land wilt verlaten?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const result =
            await database.rpc(
                "leave_ww3",
                {
                    p_token:
                        sessionToken
                }
            );

        const error =
            result.error;

        if (error) {
            throw error;
        }


        myWW3 =
            null;


        clearLocalNation();


        selectedPower =
            null;


        selectedCountry.classList.remove(
            "show"
        );


        loadMapButton.classList.remove(
            "show"
        );


        countrySelectedText.textContent =
            "NONE";


        await refreshWW3();


        alert(
            "Je hebt je land verlaten."
        );


    } catch (error) {

        console.error(
            "WW3 verlaten mislukt:",
            error
        );


        alert(
            error.message ||
            "Je kon WW3 niet verlaten."
        );

    }

}

async function refreshWW3() {

    await loadActiveWW3();

    await loadOccupiedCountries();

    await loadMyWW3();

    renderCountryList();

    updateWorldUI();

}

         */

         * WW3 laden
         */

        await refreshWW3();


        /*
         * Oude lokale keuze verwijderen

        if (!myWW3) {

            clearLocalNation();

            selectedPower =

            selectedCountry.classList.remove(
                "show"
            );

            loadMapButton.classList.remove(
                "show"
            );

            activeWW3

        console.log(
            "My WW3:",
            myWW3

    } catch (error) {

        console.error(
            "World initialization error:",

        }

    }

}
