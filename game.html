```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Conquest</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="game-screen">

        <header class="game-header">

            <div>
                <h1>GLOBAL CONQUEST</h1>

                <p id="playerName">
                    LOADING...
                </p>
            </div>

            <button
                class="logout-button"
                onclick="logout()">
                LOG OUT
            </button>

        </header>


        <main class="game-content">

            <section class="welcome-panel">

                <h2>WELCOME, COMMANDER</h2>

                <p>
                    Je bent succesvol ingelogd.
                </p>


                <div class="stats">

                    <div class="stat">
                        <span>POINTS</span>
                        <strong id="points">0</strong>
                    </div>

                    <div class="stat">
                        <span>MANPOWER</span>
                        <strong id="manpower">0</strong>
                    </div>

                    <div class="stat">
                        <span>FACTORIES</span>
                        <strong id="factories">0</strong>
                    </div>

                </div>

            </section>


            <section class="map-placeholder">

                <div class="map-icon">
                    🌍
                </div>

                <h2>WORLD MAP</h2>

                <p>
                    De wereldkaart wordt hier gebouwd.
                </p>

                <button class="start-map-button">
                    ENTER WORLD
                </button>

            </section>

        </main>

    </div>


    <script>

        // ==============================
        // SUPABASE
        // ==============================

        const supabaseUrl =
            "https://qelqaiczgibxyxfqtapg.supabase.co";

        const supabaseKey =
            "sb_publishable_aZSOOfRnROvePvZ2WWNv8g_ZhfZTCes";

        const database =
            window.supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        // ==============================
        // INGelogde speler
        // ==============================

        const speler =
            sessionStorage.getItem(
                "globalConquestPlayer"
            );


        if (!speler) {

            window.location.href = "index.html";

        } else {

            document.getElementById("playerName")
                .textContent =
                "COMMANDER: " + speler;

            laadSpeler();

        }


        // ==============================
        // PUNTEN FORMATTEREN
        // ==============================

        function formatPoints(points) {

            points = Number(points) || 0;

            const absoluut = Math.abs(points);

            // Miljard
            if (absoluut >= 1000000000) {

                return (points / 1000000000)
                    .toFixed(1)
                    .replace(".0", "") + "B";
            }

            // Miljoen
            if (absoluut >= 1000000) {

                return (points / 1000000)
                    .toFixed(1)
                    .replace(".0", "") + "M";
            }

            // Duizend
            if (absoluut >= 1000) {

                return (points / 1000)
                    .toFixed(1)
                    .replace(".0", "") + "K";
            }

            return Math.round(points).toString();
        }


        // ==============================
        // SPELER LADEN
        // ==============================

        async function laadSpeler() {

            try {

                const { data, error } =
                    await database
                        .from("players")
                        .select("naam, plus, min")
                        .eq("naam", speler)
                        .single();


                if (error) {

                    console.error(
                        "Fout bij ophalen speler:",
                        error
                    );

                    document.getElementById("points")
                        .textContent = "?";

                    return;
                }


                if (!data) {

                    document.getElementById("points")
                        .textContent = "?";

                    return;
                }


                // ==============================
                // ZELFDE PUNTENBEREKENING
                // ALS DE PUNTENBANK
                // ==============================

                const plus =
                    Number(data.plus) || 0;

                const min =
                    Number(data.min) || 0;

                const punten =
                    plus - Math.abs(min);


                // Punten tonen
                document.getElementById("points")
                    .textContent =
                    formatPoints(punten);


                console.log(
                    "Global Conquest punten:",
                    punten
                );

            } catch (error) {

                console.error(
                    "Onverwachte fout:",
                    error
                );

            }

        }


        // ==============================
        // AUTOMATISCH UPDATEN
        // ==============================

        database
            .channel("global-conquest-points")
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "players"
                },
                function(payload) {

                    // Alleen opnieuw laden als de
                    // ingelogde speler veranderd is.
                    if (
                        payload.new &&
                        payload.new.naam === speler
                    ) {
                        laadSpeler();
                    }

                    if (
                        payload.old &&
                        payload.old.naam === speler
                    ) {
                        laadSpeler();
                    }

                }
            )
            .subscribe();


        // ==============================
        // UITLOGGEN
        // ==============================

        function logout() {

            sessionStorage.removeItem(
                "globalConquestPlayer"
            );

            window.location.href =
                "index.html";
        }

    </script>

</body>
</html>
```
