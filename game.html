<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Global Conquest</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <div class="game-screen">


        <!-- ==============================
             HEADER
             ============================== -->

        <header class="game-header">

            <div>

                <h1>
                    GLOBAL CONQUEST
                </h1>

                <p id="playerName">
                    LOADING...
                </p>

            </div>


            <button
                class="logout-button"
                onclick="logout()"
            >
                LOG OUT
            </button>

        </header>



        <!-- ==============================
             GAME CONTENT
             ============================== -->

        <main class="game-content">


            <!-- ==============================
                 SPELER
                 ============================== -->

            <section class="welcome-panel">

                <h2>
                    WELCOME, COMMANDER
                </h2>

                <p>
                    Je bent succesvol ingelogd.
                </p>


                <div class="stats">


                    <div class="stat">

                        <span>
                            POINTS
                        </span>

                        <strong id="points">
                            0
                        </strong>

                    </div>


                    <div class="stat">

                        <span>
                            MANPOWER
                        </span>

                        <strong id="manpower">
                            0
                        </strong>

                    </div>


                    <div class="stat">

                        <span>
                            FACTORIES
                        </span>

                        <strong id="factories">
                            0
                        </strong>

                    </div>


                </div>

            </section>



            <!-- ==============================
                 WORLD MAP
                 ============================== -->

            <section class="map-placeholder">

                <div class="map-icon">
                    🌍
                </div>

                <h2>
                    WORLD MAP
                </h2>

                <p>
                    De wereldkaart wordt hier gebouwd.
                </p>


                <button
                    class="start-map-button"
                >
                    ENTER WORLD
                </button>

            </section>


        </main>

    </div>



    <script>


        /* =====================================================
           SUPABASE
           ===================================================== */

        const supabaseUrl =
            "https://qelqaiczgibxyxfqtapg.supabase.co";


        const supabaseKey =
            "sb_publishable_aZSOOfRnROvePvZ2WWNv8g_ZhfZTCes";


        const database =
            window.supabase.createClient(
                supabaseUrl,
                supabaseKey
            );



        /* =====================================================
           INGelogde SPELER
           ===================================================== */

        let speler =
            sessionStorage.getItem(
                "globalConquestPlayer"
            );



        /* =====================================================
           CONTROLEREN OF ER IS INGELOGD
           ===================================================== */

        if (!speler) {

            window.location.href =
                "index.html";

        }

        else {

            document
                .getElementById("playerName")
                .textContent =
                "COMMANDER: " + speler;


            laadSpeler();

        }



        /* =====================================================
           PUNTEN PARSEN

           Exact dezelfde logica als Puntenbank.

           1000  = 1K
           2500  = 2.5K
           1000000 = 1M
           2500000 = 2.5M
           ===================================================== */

        function parsePunten(waarde) {


            if (
                typeof waarde ===
                "number"
            ) {

                return waarde;

            }


            let tekst =
                String(waarde)
                    .trim()
                    .replace(
                        /,/g,
                        "."
                    );


            if (
                tekst === ""
            ) {

                return NaN;

            }


            let vermenigvuldiger =
                1;


            if (
                tekst
                    .toUpperCase()
                    .endsWith("K")
            ) {

                vermenigvuldiger =
                    1000;


                tekst =
                    tekst.slice(
                        0,
                        -1
                    );

            }


            else if (
                tekst
                    .toUpperCase()
                    .endsWith("M")
            ) {

                vermenigvuldiger =
                    1000000;


                tekst =
                    tekst.slice(
                        0,
                        -1
                    );

            }


            const getal =
                Number(tekst);


            if (
                !Number.isFinite(
                    getal
                )
            ) {

                return NaN;

            }


            return (
                getal *
                vermenigvuldiger
            );

        }



        /* =====================================================
           PUNTEN FORMATTEREN

           Exact dezelfde stijl als Puntenbank.
           ===================================================== */

        function formatPunten(
            getal
        ) {


            if (
                !Number.isFinite(
                    getal
                )
            ) {

                return "Onbepaald";

            }


            const negatief =
                getal < 0;


            const absoluut =
                Math.abs(
                    getal
                );


            let resultaat;


            if (
                absoluut >= 1000000
            ) {

                resultaat =
                    (
                        absoluut /
                        1000000
                    )
                    .toFixed(2)
                    .replace(
                        /\.?0+$/,
                        ""
                    ) +
                    "M";

            }


            else if (
                absoluut >= 1000
            ) {

                resultaat =
                    (
                        absoluut /
                        1000
                    )
                    .toFixed(2)
                    .replace(
                        /\.?0+$/,
                        ""
                    ) +
                    "K";

            }


            else {

                resultaat =
                    absoluut
                        .toFixed(2)
                        .replace(
                            /\.?0+$/,
                            ""
                        );

            }


            return negatief
                ? "-" + resultaat
                : resultaat;

        }



        /* =====================================================
           TOTAAL BEREKENEN

           Exact dezelfde berekening als Puntenbank:

           plus - abs(min)
           ===================================================== */

        function berekenTotaal(
            spelerData
        ) {


            const pluspunten =
                parsePunten(
                    spelerData.plus
                );


            const minpunten =
                parsePunten(
                    spelerData.min
                );


            if (
                Number.isFinite(
                    pluspunten
                ) &&
                Number.isFinite(
                    minpunten
                )
            ) {

                return (
                    pluspunten -
                    Math.abs(
                        minpunten
                    )
                );

            }


            return NaN;

        }



        /* =====================================================
           SPELER OPHALEN
           ===================================================== */

        async function laadSpeler() {


            try {


                const {
                    data,
                    error
                } =
                    await database

                        .from(
                            "players"
                        )

                        .select(
                            "naam, plus, min"
                        )

                        .eq(
                            "naam",
                            speler
                        )

                        .maybeSingle();



                /* ==============================
                   FOUT
                   ============================== */

                if (error) {

                    console.error(
                        "Speler laden:",
                        error
                    );


                    document
                        .getElementById(
                            "points"
                        )
                        .textContent =
                        "?";


                    return;

                }



                /* ==============================
                   ACCOUNT NIET GEVONDEN
                   ============================== */

                if (!data) {

                    console.warn(
                        "Account niet gevonden:",
                        speler
                    );


                    document
                        .getElementById(
                            "points"
                        )
                        .textContent =
                        "?";


                    return;

                }



                /* ==============================
                   PUNTEN BEREKENEN
                   ============================== */

                const totaal =
                    berekenTotaal(
                        data
                    );



                /* ==============================
                   PUNTEN OP SCHERM
                   ============================== */

                document
                    .getElementById(
                        "points"
                    )
                    .textContent =
                    formatPunten(
                        totaal
                    );



                console.log(
                    "Global Conquest:",
                    data.naam,
                    "plus:",
                    data.plus,
                    "min:",
                    data.min,
                    "totaal:",
                    totaal
                );


            }

            catch (fout) {

                console.error(
                    "Onverwachte fout:",
                    fout
                );

            }

        }



        /* =====================================================
           REALTIME PUNTENBANK

           Zodra de players-tabel verandert,
           wordt Global Conquest opnieuw bijgewerkt.

           Dus:

           Overheid verandert punten
                    ↓
           players verandert
                    ↓
           Supabase realtime
                    ↓
           Global Conquest ontvangt update
                    ↓
           punten worden opnieuw berekend
           ===================================================== */

        database

            .channel(
                "global-conquest-players"
            )

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "players"
                },

                async function(payload) {


                    console.log(
                        "Puntenbank gewijzigd:",
                        payload
                    );



                    /* ==============================
                       ACCOUNT IS HERNOEMD
                       ============================== */

                    if (
                        payload.eventType ===
                        "UPDATE"
                    ) {

                        if (
                            payload.old &&
                            payload.old.naam ===
                            speler
                        ) {

                            speler =
                                payload.new.naam;


                            sessionStorage.setItem(
                                "globalConquestPlayer",
                                speler
                            );


                            document
                                .getElementById(
                                    "playerName"
                                )
                                .textContent =
                                "COMMANDER: " +
                                speler;

                        }

                    }



                    /* ==============================
                       PUNTEN OPNIEUW LADEN
                       ============================== */

                    await laadSpeler();

                }
            )

            .subscribe();



        /* =====================================================
           UITLOGGEN
           ===================================================== */

        function logout() {


            sessionStorage.removeItem(
                "globalConquestPlayer"
            );


            window.location.href =
                "index.html";

        }


    </script>


</body>

</html>
